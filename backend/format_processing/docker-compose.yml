# Local Docker deployment of the format processing service (no HTTPS, no reverse proxy).
#
# Reachable at http://localhost:${FORMAT_PROCESSING_PORT:-5000}.
#
# For the HTTPS variant see docker-compose.https.yml.
# For the multi-service joint deployment see ../docker-compose.yml.
#
# Deploy:
#   docker compose up -d --build
#   curl http://localhost:5000/health   # -> {"status":"ok"}

services:
  format_processing:
    container_name: format_processing
    build: .
    ports:
      - "${FORMAT_PROCESSING_PORT:-5000}:5000"
    restart: unless-stopped
    environment:
      # Local dev / e2e tests run many requests in quick succession - disable the
      # per-endpoint rate limiter unless explicitly turned on. The HTTPS and joint
      # deployments leave this default-on.
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-false}
